<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorebug Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a1a; color: white; padding: 30px; display: flex; flex-direction: column; align-items: center; }
        .dashboard { background: #2a2a2a; padding: 30px; border-radius: 12px; width: 100%; max-width: 800px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #ffcc00; margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 15px; }
        
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .team-panel { background: #333; padding: 20px; border-radius: 8px; border-top: 4px solid; }
        .home-panel { border-color: #ff0000; }
        .away-panel { border-color: #34c759; }

        .control-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .scroller { display: flex; align-items: center; gap: 10px; background: #222; padding: 5px; border-radius: 6px; }
        
        button { background: #444; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; transition: background 0.2s; }
        button:hover { background: #555; }
        .val-display { font-size: 24px; font-weight: bold; width: 30px; text-align: center; }
        
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; margin-top: 5px; background: #222; border: 1px solid #444; color: white; border-radius: 4px; }
        input[type="color"] { border: none; width: 100%; height: 35px; cursor: pointer; background: none; }
        input[type="file"] { font-size: 12px; color: #aaa; margin-top: 5px; }

        .timer-panel { grid-column: 1 / -1; background: #333; padding: 20px; border-radius: 8px; text-align: center; }
        .timer-display { font-size: 50px; font-weight: bold; font-family: monospace; margin: 10px 0; }
        
        .sync-controls { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
        .sync-controls button { font-size: 14px; padding: 6px 12px; background: #222; border: 1px solid #555; }
        .sync-controls button:hover { background: #444; }
        
        .stoppage-controls { background: #222; padding: 15px; border-radius: 8px; display: inline-flex; gap: 20px; align-items: center; margin-top: 15px; border: 1px solid #444; }
        .stoppage-controls input[type="number"] { width: 60px; margin: 0; font-size: 18px; text-align: center; font-weight: bold; }

        /* Label styling for color pickers */
        .color-label { font-size: 10px; color: #aaa; text-transform: uppercase; margin-bottom: 3px; }
        .color-group { display: flex; flex-direction: column; align-items: center; width: 30%; }
    </style>
</head>
<body>

    <div class="dashboard">
        <h2>Live Scorebug Dashboard</h2>

        <!-- NEW OVERLAY BUTTON -->
        <div style="text-align: center; margin-bottom: 20px;">
            <button onclick="window.open('overlay.html', '_blank')" style="background: #007aff; font-size: 16px; padding: 10px 20px; border-radius: 8px;">
                📺 Open Overlay (Get Link)
            </button>
        </div>

        <div class="grid-layout">
            <!-- HOME TEAM PANEL -->
            <div class="team-panel home-panel">
                <input type="text" id="home-name" value="EAST BENGAL FC">
                <br><br>
                <div class="control-row">
                    <span>Score:</span>
                    <div class="scroller">
                        <button onclick="update('homeScore', -1)">-</button>
                        <span class="val-display" id="homeScore-val">0</span>
                        <button onclick="update('homeScore', 1)">+</button>
                    </div>
                </div>
                <div class="control-row">
                    <span>Red Cards:</span>
                    <div class="scroller">
                        <button onclick="update('homeReds', -1)">-</button>
                        <span class="val-display" id="homeReds-val">0</span>
                        <button onclick="update('homeReds', 1)">+</button>
                    </div>
                </div>
                
                <!-- NEW: 3 Color Pickers including Text -->
                <div class="control-row" style="justify-content: space-around; margin-top: 20px;">
                    <div class="color-group">
                        <span class="color-label">Primary</span>
                        <input type="color" id="home-pri" value="#ff0000" onchange="pushState()">
                    </div>
                    <div class="color-group">
                        <span class="color-label">Secondary</span>
                        <input type="color" id="home-sec" value="#ffcc00" onchange="pushState()">
                    </div>
                    <div class="color-group">
                        <span class="color-label">Goal Text</span>
                        <input type="color" id="home-text-color" value="#ffffff" onchange="pushState()">
                    </div>
                </div>
                
                <label style="display: block; margin-top: 15px; font-size: 13px;">Home Logo:</label>
                <input type="file" id="home-logo" accept="image/*" onchange="encodeImage(this, 'homeLogo')">
            </div>

            <!-- AWAY TEAM PANEL -->
            <div class="team-panel away-panel">
                <input type="text" id="away-name" value="AWAY TEAM">
                <br><br>
                <div class="control-row">
                    <span>Score:</span>
                    <div class="scroller">
                        <button onclick="update('awayScore', -1)">-</button>
                        <span class="val-display" id="awayScore-val">0</span>
                        <button onclick="update('awayScore', 1)">+</button>
                    </div>
                </div>
                <div class="control-row">
                    <span>Red Cards:</span>
                    <div class="scroller">
                        <button onclick="update('awayReds', -1)">-</button>
                        <span class="val-display" id="awayReds-val">0</span>
                        <button onclick="update('awayReds', 1)">+</button>
                    </div>
                </div>

                <!-- NEW: 3 Color Pickers including Text -->
                <div class="control-row" style="justify-content: space-around; margin-top: 20px;">
                    <div class="color-group">
                        <span class="color-label">Primary</span>
                        <input type="color" id="away-pri" value="#34c759" onchange="pushState()">
                    </div>
                    <div class="color-group">
                        <span class="color-label">Secondary</span>
                        <input type="color" id="away-sec" value="#ffffff" onchange="pushState()">
                    </div>
                    <div class="color-group">
                        <span class="color-label">Goal Text</span>
                        <input type="color" id="away-text-color" value="#ffffff" onchange="pushState()">
                    </div>
                </div>
                
                <label style="display: block; margin-top: 15px; font-size: 13px;">Away Logo:</label>
                <input type="file" id="away-logo" accept="image/*" onchange="encodeImage(this, 'awayLogo')">
            </div>

            <!-- SYSTEM PANEL -->
            <div class="timer-panel">
                <div class="timer-display" id="timer-val">00:00</div>
                
                <div class="sync-controls">
                    <button onclick="nudgeTimer(-60)">-1 Min</button>
                    <button onclick="nudgeTimer(-1)">-1 Sec</button>
                    <button onclick="nudgeTimer(1)">+1 Sec</button>
                    <button onclick="nudgeTimer(60)">+1 Min</button>
                </div>

                <div style="margin-bottom: 25px; display: flex; justify-content: center; align-items: center; gap: 10px;">
                    <input type="number" id="set-min" placeholder="Min" style="width: 60px; margin: 0; text-align: center;"> :
                    <input type="number" id="set-sec" placeholder="Sec" style="width: 60px; margin: 0; text-align: center;">
                    <button onclick="setExactTime()" style="background: #34a853;">Set Time</button>
                </div>

                <button id="main-timer-btn" onclick="toggleTimer()" style="background: #ffcc00; color: #000; padding: 10px 25px; font-size: 18px;">Play Main Timer</button>
                <button onclick="resetTimer()" style="padding: 10px 25px; font-size: 18px;">Reset to Zero</button>
                
                <div style="width: 100%; text-align: center;">
                    <div class="stoppage-controls">
                        <div>
                            <label style="font-weight: bold; color: #ffcc00; margin-right: 10px;">+ Stoppage (Mins):</label>
                            <input type="number" id="stoppage-input" value="3" min="1" max="15" onchange="pushState()">
                        </div>
                        <button id="stoppage-toggle" onclick="toggleStoppage()" style="background: #444; border: 1px solid #777;">Show: OFF</button>
                    </div>
                </div>
                
                <div style="margin-top: 30px; display: flex; justify-content: space-around;">
                    <div><label style="display: block; font-size: 13px;">YT Logo (Transp): </label><input type="file" accept="image/*" onchange="encodeImage(this, 'ytLogo')"></div>
                    <div><label style="display: block; font-size: 13px;">Tourney Logo: </label><input type="file" accept="image/*" onchange="encodeImage(this, 'tourneyLogo')"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let state = {
            homeScore: 0, awayScore: 0, homeReds: 0, awayReds: 0,
            homeName: "EAST BENGAL FC", awayName: "AWAY TEAM",
            homePri: "#ff0000", homeSec: "#ffcc00", homeText: "#ffffff",
            awayPri: "#34c759", awaySec: "#ffffff", awayText: "#ffffff",
            homeLogo: "", awayLogo: "", ytLogo: "", tourneyLogo: "",
            timerText: "00:00",
            showStoppage: false, stoppageTime: 3, stoppageClock: "00:00"
        };

        let totalSeconds = 0; 
        let stoppageSeconds = 0; 
        let isMainRunning = false;
        
        // --- THE MASTER LOOP ---
        setInterval(() => {
            let needsUpdate = false;

            if (isMainRunning) {
                totalSeconds++;
                needsUpdate = true;
                
                if (totalSeconds === 2700 || totalSeconds === 5400 || totalSeconds === 6300 || totalSeconds === 7200) {
                    isMainRunning = false;
                    updateTimerBtnUI();
                }
            }

            if (state.showStoppage) {
                let limitInSeconds = parseInt(state.stoppageTime) * 60;
                
                if (stoppageSeconds < limitInSeconds) {
                    stoppageSeconds++;
                    needsUpdate = true;
                }
            }

            if (needsUpdate) {
                renderTimer();
            }
        }, 1000);

        function renderTimer() {
            let m = Math.floor(totalSeconds / 60); let s = totalSeconds % 60;
            state.timerText = (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
            document.getElementById('timer-val').innerText = state.timerText;

            if (state.showStoppage) {
                let sm = Math.floor(stoppageSeconds / 60);
                let ss = stoppageSeconds % 60;
                state.stoppageClock = (sm < 10 ? "0"+sm : sm) + ":" + (ss < 10 ? "0"+ss : ss);
            }

            pushState();
        }

        function updateTimerBtnUI() {
            const btn = document.getElementById('main-timer-btn');
            if (isMainRunning) {
                btn.innerText = "Pause Main Timer";
                btn.style.background = "#ff3b30";
                btn.style.color = "white";
            } else {
                btn.innerText = "Play Main Timer";
                btn.style.background = "#ffcc00";
                btn.style.color = "black";
            }
        }

        function toggleTimer() {
            if (totalSeconds >= 7200) return; 
            isMainRunning = !isMainRunning;
            updateTimerBtnUI();
            renderTimer();
        }

        function toggleStoppage() {
            state.showStoppage = !state.showStoppage;
            const btn = document.getElementById('stoppage-toggle');
            
            if (state.showStoppage) {
                btn.innerText = "Show: ON";
                btn.style.background = "#34c759";
                
                stoppageSeconds = 0;
                state.stoppageClock = "00:00";
            } else {
                btn.innerText = "Show: OFF";
                btn.style.background = "#444";
            }
            renderTimer(); 
        }

        function nudgeTimer(secondsToChange) {
            totalSeconds += secondsToChange;
            if (totalSeconds < 0) totalSeconds = 0;
            if (totalSeconds > 7200) totalSeconds = 7200;
            renderTimer();
        }

        function setExactTime() {
            let minInput = parseInt(document.getElementById('set-min').value) || 0;
            let secInput = parseInt(document.getElementById('set-sec').value) || 0;
            
            totalSeconds = (minInput * 60) + secInput;
            if (totalSeconds < 0) totalSeconds = 0;
            if (totalSeconds > 7200) totalSeconds = 7200;
            
            document.getElementById('set-min').value = "";
            document.getElementById('set-sec').value = "";
            renderTimer();
        }

        function resetTimer() {
            isMainRunning = false; 
            totalSeconds = 0; 
            stoppageSeconds = 0;
            updateTimerBtnUI();
            renderTimer();
        }

        function update(key, change) {
            let newVal = state[key] + change;
            if (key.includes('Reds') && (newVal < 0 || newVal > 5)) return;
            if (key.includes('Score') && newVal < 0) return;
            
            state[key] = newVal;
            document.getElementById(key + '-val').innerText = newVal;
            pushState();
        }

        function encodeImage(input, key) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    state[key] = e.target.result;
                    pushState();
                };
                reader.readAsDataURL(file);
            }
        }

        function pushState() {
            state.homeName = document.getElementById('home-name').value;
            state.awayName = document.getElementById('away-name').value;
            
            state.homePri = document.getElementById('home-pri').value;
            state.homeSec = document.getElementById('home-sec').value;
            state.homeText = document.getElementById('home-text-color').value;
            
            state.awayPri = document.getElementById('away-pri').value;
            state.awaySec = document.getElementById('away-sec').value;
            state.awayText = document.getElementById('away-text-color').value;
            
            state.stoppageTime = document.getElementById('stoppage-input').value;

            // FOR VERCEL: Switch this out with Firebase/Supabase logic
            localStorage.setItem('scorebugState', JSON.stringify(state));
        }

        document.getElementById('home-name').addEventListener('input', pushState);
        document.getElementById('away-name').addEventListener('input', pushState);

        pushState();
    </script>
</body>
</html>
